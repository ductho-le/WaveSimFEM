# ==============================================================================
# Guided Wave FEM Configuration: Case 07 - Plate on Water Halfspace (Scholte & Leaky Waves)
# ==============================================================================
# Physics:
#   Guided wave propagation in an elastic plate loaded on one side by an acoustic
#   fluid halfspace (unilateral fluid loading / plate on fluid substrate).
#   - Plate     (y in [0, 1.5] mm):   Aluminum plate (isotropic solid)
#   - Substrate (y in [-15, 0] mm):  Acoustic fluid (water, c_f = 1480 m/s, rho = 1000 kg/m³)
#
# Acoustic Wave Phenomena:
#   1. Scholte interface wave: A true boundary-guided wave localized at the solid-fluid
#      interface propagating at c_Scholte ≈ 0.99 * c_f ≈ 1470 m/s. Because c_Scholte < c_f,
#      it is non-radiating into the fluid bulk (evanescent decay away from interface).
#   2. Leaky Lamb waves: Fast plate modes (phase velocity c_p > c_f) radiate acoustic energy
#      into the fluid substrate at the Rayleigh/Mach radiation angle θ = arcsin(c_f / c_p).
#
# Fluid Formulation:
#   Displacement-based acoustic fluid formulation with shear modulus regularization
#   (μ_f = 1e-8 * K_f) providing natural kinematic and stress continuity across conforming
#   solid-fluid interface elements without auxiliary Lagrange multipliers.
# ==============================================================================

solver:
  type: "explicit"              # Velocity Verlet explicit scheme
  CFL: 0.5                      # CFL stability factor
  time_factor: 1.3              # Total duration multiplier

geometry:
  sensing_length: 0.25          # [m] 250 mm sensing region along plate top face
  absorb_length: 0.12           # [m] 120 mm left/right absorbing sponges

structure:
  mode: "plate_on_halfspace"    # Plate resting on halfspace substrate
  layers:
    - name: "Aluminum Plate"
      thickness: 1.5e-3         # [m] 1.5 mm plate thickness
      material_model: "isotropic"
      rho: 2700.0               # [kg/m³]
      E: 70.0e9                 # [Pa] Young's modulus (70 GPa)
      nu: 0.33                  # [-] Poisson's ratio (c_L = 6198 m/s, c_T = 3122 m/s)
      min_elems_y: 6

  substrate:
    name: "Water Halfspace Substrate"
    thickness: 15.0e-3          # [m] Truncation depth (15 mm)
    absorb_depth: 10.0e-3       # [m] Bottom acoustic sponge (10 mm, leaving 5 mm clean fluid)
    material_model: "fluid"     # Acoustic fluid medium
    rho: 1000.0                 # [kg/m³] Water density
    c: 1480.0                   # [m/s] Acoustic sound speed (K = rho * c² ≈ 2.19 GPa)
    min_elems_y: 12

absorbing_boundaries:
  alpha: null                   # Peak mass damping (auto: 1e7)
  beta: null                    # Peak stiffness damping (auto: 1e-8)

excitation:
  f_center: 1.0e6               # [Hz] 1.0 MHz central frequency Ricker wavelet
  traction_max: 1.0e6           # [Pa] 1.0 MPa
  excitation_width: 2.0e-3      # [m] 2.0 mm
  source_x: null                # [m] Auto-centered at absorb_length + 20 mm
  source_fx: 0.0                # Out-of-plane normal excitation (favors flexural & leaky modes)
  source_fy: 1.0

mesh:
  elems_per_wavelength: 10
  min_elems_x: 100
  min_elems_y: 4
  degree: 2

sensors:
  n_sensors: 351                # Sensors positioned along plate top face (y = 1.5 mm)
  sensor_offset: 0.04           # [m] 40 mm
  sensor_pitch: 0.5e-3          # [m] 0.5 mm

postprocess:
  run_postprocess: true
  f_min_disp_MHz: 0.0
  f_max_disp_MHz: 2.5
  k_min_disp: 0.0
  k_max_disp: 4.0

output:
  output_dir: "results_case07_plate_on_water"
  write_vtx: false
  target_snapshots: 200
