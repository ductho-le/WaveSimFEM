# ==============================================================================
# Guided Wave FEM Configuration: Case 02 - Cortical Bone Plate (Viscoelastic)
# ==============================================================================
# Physics:
#   Guided Lamb wave propagation in anisotropic, viscoelastic cortical bone plate.
#   Constitutive law: Kelvin-Voigt viscoelasticity (σ = C:ε + Cv:∂ε/∂t)
#   Demonstrates material damping, frequency-dependent attenuation, and velocity dispersion.
# ==============================================================================

solver:
  type: "implicit"              # Newmark-beta implicit solver (unconditionally stable)
  CFL: 0.5                      # CFL factor for time-step determination
  time_factor: 1.2              # Total duration factor
  beta: 0.25                    # Newmark-beta (average acceleration method)
  gamma: 0.5                    # Newmark-gamma (second-order accuracy)

geometry:
  sensing_length: 0.30          # [m] Pristine sensing region length
  absorb_length: 0.15           # [m] Width of absorbing sponge on both ends

structure:
  mode: "1_layer"               # Single plate in vacuum
  single_layer:
    name: "Cortical Bone"
    thickness: 3.0e-3           # [m] 3.0 mm cortical bone plate
    material_model: "viscoelastic"  # Anisotropic elasticity + viscous dissipation
    rho: 1948.0                 # [kg/m³] Bone mass density
    # 2D Voigt elasticity matrix [C11, C12, C16, C22, C26, C66] in Pa:
    C: [31.7e9, 13.4e9, 0.0, 20.2e9, 0.0, 6.38e9]
    # 2D Voigt viscosity matrix [Cv11, Cv12, Cv16, Cv22, Cv26, Cv66] in Pa·s:
    Cv: [157.0, 121.0, 0.0, 109.0, 0.0, 18.0]
    min_elems_y: 6              # Minimum elements across bone thickness

absorbing_boundaries:
  alpha: null                   # Peak mass-proportional damping (null = auto: 1e9 for implicit)
  beta: null                    # Peak stiffness-proportional damping (null = auto: 1e-7 for implicit)

excitation:
  f_center: 1.0e6               # [Hz] Center frequency: 1.0 MHz
  traction_max: 1.0e6           # [Pa] Surface load: 1.0 MPa
  excitation_width: 2.0e-3      # [m] Gaussian strip width: 2.0 mm
  source_x: null                # [m] Excitation position (null = absorb_length + 0.005)
  source_fx: 1.0                # Horizontal traction component
  source_fy: 1.0                # Vertical traction component

mesh:
  elems_per_wavelength: 10      # Elements per shortest shear wavelength
  min_elems_x: 100              # Element floor along propagation axis
  min_elems_y: 4                # Element floor through thickness
  degree: 2                     # Polynomial order (Q2 quadrilateral)

sensors:
  n_sensors: 401                # Measurement sensors
  sensor_offset: 0.05           # [m] 50 mm distance from source
  sensor_pitch: 0.5e-3          # [m] 0.5 mm pitch

postprocess:
  run_postprocess: true         # 2D FFT dispersion analysis
  f_min_disp_MHz: 0.0           # [MHz] Min frequency
  f_max_disp_MHz: 2.0           # [MHz] Max frequency
  k_min_disp: 0.0               # [rad/mm] Min wavenumber
  k_max_disp: 3.0               # [rad/mm] Max wavenumber

output:
  output_dir: "results_case02_bone_viscoelastic"
  write_vtx: false
  target_snapshots: 200
