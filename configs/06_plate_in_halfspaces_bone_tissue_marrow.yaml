# ==============================================================================
# Guided Wave FEM Configuration: Case 06 - Plate Embedded in Halfspaces (Interface Waves)
# ==============================================================================
# Physics:
#   Guided wave propagation in a solid plate embedded between two distinct
#   semi-infinite acoustic/elastic media.
#   - Bottom Substrate (y in [-12, 0] mm): Bone marrow with bottom absorbing sponge
#   - Central Plate    (y in [0, 2] mm):   Cortical bone plate
#   - Top Superstrate  (y in [2, 14] mm):  Soft tissue with top absorbing sponge
#
# Boundary & Interface Formulation:
#   2D absorbing sponge layers applied to all 4 exterior boundaries (Left, Right,
#   Bottom, and Top). Excitation applied directly at the interior plate-superstrate
#   interface (y = H_plate = 2.0 mm) via internal facet jump measure dS.
#   Demonstrates Stoneley interface waves, radiated bulk waves, and interface mode trapping.
# ==============================================================================

solver:
  type: "explicit"              # Velocity Verlet explicit scheme
  CFL: 0.5                      # CFL stability factor
  time_factor: 1.2              # Total duration multiplier

geometry:
  sensing_length: 0.30          # [m] 300 mm sensing region along plate-superstrate interface
  absorb_length: 0.15           # [m] 150 mm lateral sponge width

structure:
  mode: "plate_in_halfspaces"   # Plate embedded between dual halfspaces
  layers:
    - name: "Cortical Bone Plate"
      thickness: 2.0e-3         # [m] 2.0 mm plate thickness
      material_model: "anisotropic"
      rho: 1948.0               # [kg/m³]
      C: [31.7e9, 13.4e9, 0.0, 20.2e9, 0.0, 6.38e9] # [Pa]
      min_elems_y: 6

  substrate:
    name: "Bone Marrow Substrate (Bottom)"
    thickness: 12.0e-3          # [m] 12 mm truncation depth
    absorb_depth: 8.0e-3        # [m] 8 mm bottom absorbing sponge
    material_model: "isotropic"
    rho: 1000.0                 # [kg/m³]
    E: 2.0e9                    # [Pa]
    nu: 0.40
    min_elems_y: 12

  superstrate:
    name: "Soft Tissue Superstrate (Top)"
    thickness: 12.0e-3          # [m] 12 mm truncation height
    absorb_depth: 8.0e-3        # [m] 8 mm top absorbing sponge
    material_model: "isotropic"
    rho: 1000.0                 # [kg/m³]
    E: 2.25e9                   # [Pa]
    nu: 0.45
    min_elems_y: 12

absorbing_boundaries:
  alpha: null                   # Peak mass damping (auto: 1e7)
  beta: null                    # Peak stiffness damping (auto: 1e-8)

excitation:
  f_center: 1.0e6               # [Hz] 1.0 MHz Ricker wavelet
  traction_max: 1.0e6           # [Pa] 1.0 MPa
  excitation_width: 2.0e-3      # [m] 2.0 mm
  source_x: null                # [m]
  source_fx: 1.0                # 45-degree combined traction
  source_fy: 1.0

mesh:
  elems_per_wavelength: 10
  min_elems_x: 100
  min_elems_y: 4
  degree: 2

sensors:
  n_sensors: 401                # Sensors positioned at interface y = 2.0 mm
  sensor_offset: 0.05           # [m] 50 mm
  sensor_pitch: 0.5e-3          # [m] 0.5 mm

postprocess:
  run_postprocess: true
  f_min_disp_MHz: 0.0
  f_max_disp_MHz: 2.0
  k_min_disp: 0.0
  k_max_disp: 3.0

output:
  output_dir: "results_case06_plate_in_halfspaces"
  write_vtx: false
  target_snapshots: 200
