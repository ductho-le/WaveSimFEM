# Adhesively bonded aluminium joint, Al / epoxy / Al (aerospace NDE of bonds)
# Adhesive stiffness and viscosity control bond-sensitive mode dispersion and loss.
# Faces are traction-free with a normal top load, perfectly bonded interfaces,
# and lateral sponges. Higher modes may contribute at f*d = 2.2 MHz*mm.
# Kelvin-Voigt Cv = eta * C, eta = 2.65e-8 s: loss factor 0.05 at 300 kHz,
# approximately 0.167 at 1 MHz.
#
# Application
#   Bond-sensitive dispersion and attenuation in an aluminium/epoxy sandwich.
# Model and numerical scope
#   Uniform, perfectly bonded 2D plane-strain layers with representative material
#   properties. The model describes an intact sandwich, without lap geometry.
#   A five-cycle 1 MHz pulse is analysed to 1.5 MHz. Implicit Newmark integration
#   avoids the adhesive's viscous explicit stability restriction. Q2 spacing gives
#   approximately six elements per adhesive shear wavelength at the band edge.
#   Establish time-step, mesh, and arrival-window convergence; compare dispersion
#   with an independent multilayer solution.
# Usage
#   sh tools/run_cpu4.sh -c configs/02_layers_bonded_joint.yaml
#   Add --dry-run to inspect resource estimates. Run from the repository root.
#   The launcher uses four MPI ranks with one library thread per rank.
# Conventions
#   Numeric inputs use SI units; null selects automatic sizing. Layer and mesh
#   lists run bottom-to-top. See template.yaml and README.md for parameter guidance.
#
# References
#   - M. J. S. Lowe, R. E. Challis, C. W. Chan (2000), "The transmission of Lamb
#     waves across adhesively bonded lap joints", J. Acoust. Soc. Am. 107, 1333-1345.
#   - P. B. Nagy, L. Adler (1989), "Nondestructive evaluation of adhesive joints
#     by guided waves", J. Appl. Phys. 66, 4658-4663.

solver:
  # Implicit integration avoids the adhesive's viscous explicit stability limit.
  type: "implicit"
  steps_per_period: 40         # 40 steps per band-edge period; requested dt = 16.7 ns
  beta: 0.25                   # Average-acceleration Newmark, no numerical damping
  gamma: 0.5
  device: cpu                  # Implicit solver uses CPU/PETSc
  precision: double
  dt: null                     # [s] Use steps_per_period and max_frequency
  duration: null               # Bulk-speed estimate; verify slow guided arrivals
  time_factor: 1.2             # Travel-time multiplier for automatic duration

geometry:
  sensing_length: 0.30          # [m]
  absorb_length: 0.05           # [m]

structure:
  mode: "N_layers"
  layers:
    - name: "Aluminium adherend, bottom (2024-T3)"
      thickness: 1.0e-3         # [m]
      material_model: "isotropic"
      rho: 2780.0               # [kg/m^3]
      E: 73.1e9                 # [Pa]
      nu: 0.33

    - name: "Epoxy adhesive"
      thickness: 0.2e-3         # [m]
      material_model: "viscoelastic"
      rho: 1200.0               # [kg/m^3]
      # Plane-strain Voigt order [C11, C12, C16, C22, C26, C66]
      C: [8.112e9, 5.208e9, 0.0, 8.112e9, 0.0, 1.452e9]   # [Pa]
      Cv: [215.2, 138.2, 0.0, 215.2, 0.0, 38.5]            # [Pa*s] = 2.65e-8 s * C

    - name: "Aluminium adherend, top (2024-T3)"
      thickness: 1.0e-3         # [m]
      material_model: "isotropic"
      rho: 2780.0              # [kg/m^3]
      E: 73.1e9                # [Pa]
      nu: 0.33

absorbing_boundaries:
  alpha: null                  # Frequency-scaled lateral sponge damping [1/s]
  beta: null                   # Stiffness damping [s]; distinct from Newmark beta

excitation:
  source_type: "tone_burst"     # Hann-windowed sine burst (narrowband, mode-selective)
  n_cycles: 5                   # -6 dB bandwidth ≈ 2/5 of f0
  f_center: 1e6                 # [Hz]
  traction_max: 1.0e6           # [Pa]
  excitation_width: 2.0e-3      # [m]
  source_x: null               # [m] Automatic source position inside the sensing region
  source_fx: 0.0
  source_fy: 1.0

mesh:
  nx: 3300                     # Full 400 mm domain; dx = 0.121 mm
  ny_per_region: [6, 2, 6]      # Bottom Al / epoxy / top Al; dy = 0.167/0.1/0.167 mm
  degree: 2
  max_frequency: 1.5e6          # [Hz] Covers the main lobe of the five-cycle burst
  min_frequency: 0.5e6         # [Hz] Arrival-sizing band; does not filter the burst
  min_wavelength: 0.7e-3       # [m] Wavelength bound for sizing; verify against guided modes

sensors:
  n_sensors: 401
  sensor_offset: 0.05           # [m]
  sensor_pitch: 0.50e-3         # [m]
  # This array targets k <= 3 rad/mm; it does not resolve every adhesive-localised
  # branch. For wavelengths near 0.7 mm use pitch <= 0.175 mm and more receivers.
  sensor_y: null               # Upper aluminium face, y = 2.2 mm
  sample_rate: "15 MHz"        # Requested storage rate: 10 samples per band-edge period

# Display limits do not filter the excitation or recorded histories.
postprocess:
  structure_analysis: true    # Structure-specific dispersion, wave references and transport panels
  run_postprocess: true
  # Receiver reports: isolate the same packet across the array for attenuation fits.
  wave_characterisation:
    enabled: true
    component: y
    frequency_band: ["0.7 MHz", "1.3 MHz"]
    time_window: null          # Full record; specify [start, end] in seconds to isolate a mode
    min_relative_amplitude: 0.01 # Exclude peaks below 1% of the array maximum
  f_min: 0.0
  f_max: "1.5 MHz"
  k_min: 0.0
  k_max: "3 rad/mm"

# Receiver histories and figures; full-field output is optional.
output:
  output_dir: "results_02_layers_bonded_joint"
  write_vtx: false
  quick_plot: true
  compress_output: false
  history_storage: memory      # Switch to disk if histories dominate available RAM
  figure_formats: [png]
  usetex: false                # true enables external LaTeX; default needs no TeX install
