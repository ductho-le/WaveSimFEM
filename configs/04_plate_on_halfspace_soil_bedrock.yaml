# Soft soil layer over bedrock: seismic surface waves (MASW site characterisation)
# A vertical impact generates dispersive Rayleigh waves, approaching bedrock
# speed (~1.1 km/s) at low frequency and soil speed (~187 m/s) at high frequency.
# Bedrock P-waves (wavelength ≈ 160 m at f0) exceed the bottom sponge depth,
# so late bedrock arrivals are only partially absorbed.
#
# Application
#   Multichannel analysis of surface waves (MASW) for layered-site characterisation.
# Model and numerical scope
#   Linear elastic 2D plane strain with a perfectly bonded horizontal interface.
#   Intrinsic attenuation, topography, and nonlinear soil response are excluded.
#   The 5-30 Hz analysis band uses 1 m horizontal Q2 spacing. Bedrock rows are
#   coarser because its shear speed is six times the soil speed. Establish mesh,
#   time-step, and depth convergence before interpreting the low-frequency branch.
# Usage
#   sh tools/run_cpu4.sh -c configs/04_plate_on_halfspace_soil_bedrock.yaml
#   Add --dry-run to inspect resource estimates. Run from the repository root.
#   The launcher uses four MPI ranks with one library thread per rank.
# Conventions
#   Numeric inputs use SI units; null selects automatic sizing. Mesh region counts
#   run bottom-to-top. See template.yaml and README.md for parameter guidance.
#
# References
#   - C. B. Park, R. D. Miller, J. Xia (1999), "Multichannel analysis of surface
#     waves", Geophysics 64, 800-808.
#   - S. Foti et al. (2018), "Guidelines for the good practice of surface wave
#     analysis", Bull. Earthquake Eng. 16, 2367-2420.

solver:
  type: "explicit"
  CFL: 0.8                     # Fraction of the assembled RK4 stability limit
  device: cpu
  precision: double
  dt: null                     # [s] Use the assembled RK4 stability bound
  duration: 2.5                # [s] Full dispersive wave-train traversal over 400 m
  time_factor: 1.2             # Travel-time multiplier for automatic duration

geometry:
  sensing_length: 440.0         # [m]
  absorb_length: 60.0           # [m]

structure:
  mode: "plate_on_halfspace"
  layers:
    - name: "Soft soil (silty clay)"
      thickness: 10.0           # [m]
      material_model: "isotropic"
      rho: 1800.0               # [kg/m^3]
      E: 1.92e8                 # [Pa]  -> Vs = 200 m/s
      nu: 0.3333333             # [-]   -> Vp = 2 Vs = 400 m/s

  substrate:
    name: "Bedrock (weathered granite)"
    thickness: 75.0             # [m] Truncation depth below the interface
    absorb_depth: 50.0          # [m] Bottom sponge
    material_model: "isotropic"
    rho: 2400.0                 # [kg/m^3]
    E: 9.216e9                  # [Pa]  -> Vs = 1200 m/s
    nu: 0.3333333               # [-]   -> Vp = 2400 m/s

absorbing_boundaries:
  alpha: null
  beta: 0.0                     # [s]

excitation:
  source_type: "ricker"
  f_center: 15.0                # [Hz]
  traction_max: 1.0e4           # [Pa]
  excitation_width: 2.0         # [m]
  source_x: null               # [m] Automatic source position inside the sensing region
  source_fx: 1.0
  source_fy: 1.0

mesh:
  nx: 560                      # Full 560 m domain, including both lateral sponges (dx = 1.0 m)
  ny_per_region: [25, 10]       # Bedrock dy = 3.0 m; soil dy = 1.0 m
  degree: 2
  max_frequency: 30.0           # [Hz] Two times the Ricker peak; no spectral filtering
  min_frequency: 5.0            # [Hz] Arrival-sizing lower edge
  min_wavelength: 6.0           # [m] Near high-frequency soil Rayleigh wavelength

sensors:
  n_sensors: 401
  sensor_offset: 20.0           # [m]
  sensor_pitch: 1.0             # [m]; 400 m aperture
  sensor_y: null                # Soil free surface, y = 10 m
  sample_rate: "300 Hz"        # 10 samples per band-edge period

# Display limits do not filter the excitation or recorded histories.
postprocess:
  structure_analysis: true    # Structure-specific dispersion, wave references and transport panels
  run_postprocess: true
  # Receiver reports: inspect dispersive arrivals and exclude reflected packets.
  wave_characterisation:
    enabled: true
    component: y
    frequency_band: ["8 Hz", "25 Hz"]
    time_window: null          # Full record; specify [start, end] in seconds to isolate a packet
    min_relative_amplitude: 0.01 # Exclude peaks below 1% of the array maximum
  f_min: 0.0
  f_max: "30 Hz"
  k_min: 0.0
  k_max: "1.0 rad/m"

# Receiver histories and figures; full-field output is optional.
output:
  output_dir: "results_04_plate_on_halfspace_soil_bedrock"
  write_vtx: false
  quick_plot: true
  compress_output: false
  history_storage: memory
  figure_formats: [png]
  usetex: false                # true enables external LaTeX; default needs no TeX install
