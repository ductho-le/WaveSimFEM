# Scalar-pressure acoustics in a water channel. Numeric values use SI units.
# Run: python -m wavesimfem -c configs/07_fluid_acoustic.yaml
# A top-wall normal-acceleration pulse drives pressure; the bottom is rigid.
# Left/right radiation boundaries are exact only for normally outgoing waves.
solver:
  type: explicit
  device: cpu
  precision: double
  CFL: 0.7
  duration: 25.0e-6
geometry:
  sensing_length: 0.025
  absorb_length: 0.0
structure:
  mode: 1_layer
  single_layer:
    name: Water
    thickness: 2.0e-3
    material_model: fluid
    fluid_formulation: acoustic
    rho: 1000.0
    c: 1500.0
absorbing_boundaries:
  alpha: 0.0
  beta: 0.0
acoustic_boundaries:
  top: rigid
  bottom: rigid
  left: radiation
  right: radiation
excitation:
  source_kind: acoustic_normal_acceleration
  source_boundary: top
  source_amplitude: 1.0e5      # m/s^2, positive inward normal acceleration
  source_type: ricker
  f_center: 250.0e3
  source_x: 3.0e-3
  excitation_width: 1.0e-3
mesh:
  nx: 100
  ny_per_region: [8]
  degree: 2
  max_frequency: 500.0e3
sensors:
  observable: pressure
  region: Water
  sensor_y: 1.0e-3
  n_sensors: 31
  sensor_offset: 3.0e-3
  sensor_pitch: 0.5e-3
  sample_rate: 10 MHz
postprocess:
  run_postprocess: true
  structure_analysis: true
output:
  output_dir: results_07_fluid_acoustic
  history_storage: memory
  quick_plot: true
  write_vtx: false
  figure_formats: [png]
  usetex: false
