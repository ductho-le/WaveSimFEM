# Aluminium plate loaded on one side by a water half-space, with independent
# pressure and displacement DOFs (leaky Lamb / quasi-Scholte waves).
# Run: python -m wavesimfem -c configs/08_fluid_solid_acoustic.yaml
# A normal traction on the plate side of the plate-water interface (y = 0)
# excites the plate; receivers measure fluid pressure 0.25 mm below it.
# The 40 mm, 81-receiver line array spans several A0 and water wavelengths, so
# the f-k analysis resolves the fluid-loaded plate modes. The water depth ends
# in a sponge, so obliquely leaking radiation is absorbed rather than reflected
# by a plane-wave impedance face. The plate's upper surface is traction-free.
# Change solver.type to implicit to use the coupled Newmark method.
solver:
  type: explicit
  device: cpu
  precision: double
  CFL: 0.7
  duration: 50.0e-6
geometry:
  sensing_length: 0.060
  absorb_length: 0.010
structure:
  mode: plate_on_halfspace
  layers:
    - name: Aluminium
      thickness: 1.0e-3
      material_model: isotropic
      rho: 2700.0
      E: 70.0e9
      nu: 0.33
  substrate:
    name: Water
    thickness: 8.0e-3          # [m] Truncation depth
    absorb_depth: 5.0e-3       # [m] Sponge inside the truncation depth
    material_model: fluid
    fluid_formulation: acoustic
    rho: 1000.0
    c: 1500.0
absorbing_boundaries:
  alpha: null                  # Frequency-scaled lateral and half-space sponges
  beta: null
acoustic_boundaries:
  bottom: rigid                # Behind the half-space sponge
  left: radiation
  right: radiation
excitation:
  source_kind: traction
  source_boundary: interface
  source_region: Aluminium
  source_y: 0.0
  traction_max: 1.0e6          # Pa
  source_fx: 0.0
  source_fy: 1.0
  source_type: ricker
  f_center: 200.0e3
  source_x: 14.0e-3
  excitation_width: 1.0e-3
mesh:
  nx: 320                      # dx = 0.25 mm
  ny_per_region: [32, 4]       # Water / aluminium; dy = 0.25 mm
  degree: 2
  max_frequency: 500.0e3
sensors:
  observable: pressure
  region: Water
  sensor_y: -0.25e-3
  n_sensors: 81
  sensor_offset: 4.0e-3
  sensor_pitch: 0.5e-3
  sample_rate: 5 MHz
postprocess:
  run_postprocess: true
  structure_analysis: true
output:
  output_dir: results_08_fluid_solid_acoustic
  history_storage: memory
  quick_plot: true
  write_vtx: false
  figure_formats: [png]
  usetex: false
