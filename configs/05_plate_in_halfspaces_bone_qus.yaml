# ==============================================================================
# Example 05 - structure.mode: "plate_in_halfspaces"
# Cortical bone between soft tissue and marrow (quantitative ultrasound, QUS)
# ==============================================================================
# Physics
#   Axial-transmission QUS probes long bones (radius, tibia) with transducers
#   placed on the skin. The cortical shell is a guided-wave plate loaded by soft
#   tissue on the outside and marrow on the inside. Its first-arriving signal
#   (FAS, close to the bulk/lateral wave along the bone axis) and the
#   flexural-like A0 mode are sensitive to cortical thickness and porosity, and
#   are used to assess osteoporosis and fracture risk.
#
# Model
#   - Superstrate (top, 10 mm incl. 6 mm sponge): soft tissue, fluid,
#     rho = 1050 kg/m^3, c = 1540 m/s
#   - Plate (3 mm): cortical bone, transversely isotropic, Kelvin-Voigt
#     viscoelastic; x = bone axis (C11 = 31.7 GPa), y = radial (C22 = 20.2 GPa)
#   - Substrate (bottom, 10 mm incl. 6 mm sponge): marrow, fluid,
#     rho = 930 kg/m^3, c = 1480 m/s
#   Load and sensors sit on the bone / soft-tissue interface, mimicking a probe
#   coupled through the soft tissue. Fluids use the regularised small-shear
#   formulation (mu_f = 1e-8 K_f), so fluid-loading and leakage are approximate.
#
# References
#   - E. Bossy, M. Talmant, P. Laugier (2004), "Three-dimensional simulations of
#     ultrasonic axial transmission velocity measurement on cortical bone models",
#     J. Acoust. Soc. Am. 115, 2314-2324.
#   - P. Moilanen (2008), "Ultrasonic guided waves in bone",
#     IEEE Trans. Ultrason. Ferroelectr. Freq. Control 55, 1277-1286.
#   - D. T. Le et al. (2025), "Guided waves in anisotropic and viscoelastic
#     stratified plates: application to bone quantitative ultrasound",
#     Computers & Structures (cortical bone C and Cv values).
# ==============================================================================

solver:
  type: "explicit"
  CFL: 0.5
  time_factor: 1.2              # T = 1.2 * sensing_length / slowest speed + pulse length

geometry:
  sensing_length: 0.06          # [m] 60 mm along the bone axis
  absorb_length: 0.03           # [m] 30 mm lateral sponges

structure:
  mode: "plate_in_halfspaces"
  layers:
    - name: "Cortical bone"
      thickness: 3.0e-3         # [m] 3 mm cortical shell
      material_model: "viscoelastic"
      rho: 1948.0               # [kg/m^3]
      # Plane-strain Voigt order [C11, C12, C16, C22, C26, C66]
      C: [31.7e9, 13.4e9, 0.0, 20.2e9, 0.0, 6.38e9]   # [Pa]
      Cv: [157.0, 121.0, 0.0, 109.0, 0.0, 18.0]        # [Pa*s]
      min_elems_y: 12

  substrate:
    name: "Bone marrow"
    thickness: 10.0e-3          # [m]
    absorb_depth: 6.0e-3        # [m]
    material_model: "fluid"
    rho: 930.0                  # [kg/m^3]
    c: 1480.0                   # [m/s]

  superstrate:
    name: "Soft tissue"
    thickness: 10.0e-3          # [m]
    absorb_depth: 6.0e-3        # [m]
    material_model: "fluid"
    rho: 1050.0                 # [kg/m^3]
    c: 1540.0                   # [m/s]

excitation:
  source_type: "ricker"
  f_center: 500.0e3             # [Hz] 500 kHz (typical axial-transmission band 0.2-1 MHz)
  traction_max: 1.0e6           # [Pa]
  excitation_width: 2.0e-3      # [m]
  source_x: null                # [m] null = absorb_length + max(5 mm, excitation_width)
  source_fx: 0.0                # Normal load from the tissue side
  source_fy: 1.0

mesh:
  elems_per_wavelength: 8       # Per shortest wavelength (marrow, 1.5 mm at 1 MHz)
  min_elems_x: 100
  min_elems_y: 4
  degree: 2
  max_frequency: 1.0e6          # [Hz]

sensors:
  n_sensors: 81                 # On the bone / soft-tissue interface, 40 mm array
  sensor_offset: 0.01           # [m] 10 mm source-to-first-receiver
  sensor_pitch: 0.5e-3          # [m]

postprocess:
  run_postprocess: true
  f_min: 0.0
  f_max: "1 MHz"
  k_min: 0.0
  k_max: "4 rad/mm"

output:
  output_dir: "results_05_plate_in_halfspaces_bone_qus"
  write_vtx: false
  target_snapshots: 200
