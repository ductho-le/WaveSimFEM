# ==============================================================================
# Guided Wave FEM Configuration: Case 05 - Plate on Halfspace (Leaky Guided Waves)
# ==============================================================================
# Physics:
#   Guided wave propagation in a finite plate resting upon an elastic substrate.
#   - Plate (y in [0, 2] mm): Cortical bone layer
#   - Substrate (y in [-12, 0] mm): Bone marrow halfspace with bottom absorbing sponge
#   Demonstrates energy leakage from the solid wave guide into the softer substrate,
#   generalized Rayleigh/Sezawa modes, and modified dispersion characteristics.
# ==============================================================================

solver:
  type: "explicit"              # Velocity Verlet explicit scheme
  CFL: 0.5                      # CFL stability factor
  time_factor: 1.2              # Total duration multiplier

geometry:
  sensing_length: 0.30          # [m] 300 mm sensing region along plate top face
  absorb_length: 0.15           # [m] 150 mm left/right absorbing sponges

structure:
  mode: "plate_on_halfspace"    # Plate on substrate halfspace
  layers:
    - name: "Cortical Bone Plate"
      thickness: 2.0e-3         # [m] 2.0 mm plate thickness
      material_model: "anisotropic"
      rho: 1948.0               # [kg/m³]
      C: [31.7e9, 13.4e9, 0.0, 20.2e9, 0.0, 6.38e9] # [Pa]
      min_elems_y: 6

  substrate:
    name: "Bone Marrow Substrate"
    thickness: 12.0e-3          # [m] Truncation depth (12 mm)
    absorb_depth: 8.0e-3        # [m] Bottom sponge thickness (8 mm, leaving 4 mm clean depth)
    material_model: "isotropic"
    rho: 1000.0                 # [kg/m³]
    E: 2.0e9                    # [Pa] Young's modulus (2.0 GPa)
    nu: 0.40                    # [-] Poisson's ratio
    min_elems_y: 12

absorbing_boundaries:
  alpha: null                   # Peak mass damping (auto: 1e7)
  beta: null                    # Peak stiffness damping (auto: 1e-8)

excitation:
  f_center: 1.0e6               # [Hz] 1.0 MHz Ricker wavelet
  traction_max: 1.0e6           # [Pa] 1.0 MPa
  excitation_width: 2.0e-3      # [m] 2.0 mm
  source_x: null                # [m]
  source_fx: 1.0                # Combined horizontal & vertical load
  source_fy: 1.0

mesh:
  elems_per_wavelength: 10
  min_elems_x: 100
  min_elems_y: 4
  degree: 2

sensors:
  n_sensors: 401                # Sensors positioned along plate top face (y = 2.0 mm)
  sensor_offset: 0.05           # [m] 50 mm
  sensor_pitch: 0.5e-3          # [m] 0.5 mm

postprocess:
  run_postprocess: true
  f_min_disp_MHz: 0.0
  f_max_disp_MHz: 2.0
  k_min_disp: 0.0
  k_max_disp: 3.0

output:
  output_dir: "results_case05_plate_on_halfspace"
  write_vtx: false
  target_snapshots: 200
