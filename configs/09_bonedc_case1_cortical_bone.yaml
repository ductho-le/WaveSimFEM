# ==============================================================================
# Guided Wave FEM Configuration: Case 09 - BoneDC Benchmark 1: Cortical Bone Plate
# ==============================================================================
# Benchmark Comparison with Spectral Collocation Method (SCM) from BoneDC:
#   - Plate: 4.0 mm Cortical Bone (CB) elastic anisotropic plate in vacuum
#   - Density: rho = 1948 kg/m³
#   - Elasticity (Voigt): C11 = 31.7 GPa, C12 = 13.4 GPa, C22 = 20.2 GPa, C66 = 6.38 GPa
#
# Reference:
#   Le et al. (2025), Guided waves in anisotropic and viscoelastic stratified plates:
#   Application to bone quantitative ultrasound, Computers & Structures.
# ==============================================================================

solver:
  type: "explicit"              # Velocity Verlet explicit scheme
  CFL: 0.5                      # CFL stability factor
  time_factor: 1.2              # Total duration multiplier

geometry:
  sensing_length: 0.15          # [m] 150 mm sensing region along plate top face
  absorb_length: 0.05           # [m] 50 mm lateral absorbing sponge width

structure:
  mode: "1_layer"               # Single elastic plate in vacuum
  single_layer:
    name: "Cortical Bone (CB)"
    thickness: 4.0e-3           # [m] 4.0 mm plate thickness
    material_model: "anisotropic"
    rho: 1948.0                 # [kg/m³]
    C: [31.7e9, 13.4e9, 0.0, 20.2e9, 0.0, 6.38e9] # [Pa]
    min_elems_y: 16

absorbing_boundaries:
  alpha: null                   # Peak mass damping (auto: 1e7)
  beta: null                    # Peak stiffness damping (auto: 1e-8)

excitation:
  f_center: 0.5e6               # [Hz] 500 kHz center frequency (covers 0 - 1.2 MHz band)
  traction_max: 1.0e6           # [Pa] 1.0 MPa
  excitation_width: 2.0e-3      # [m] 2.0 mm Gaussian strip width
  source_x: null                # [m] Auto-centered at absorb_length + 10 mm
  source_fx: 1.0                # Combined in-plane & out-of-plane loading
  source_fy: 1.0                # to excite both Symmetric and Antisymmetric modes

mesh:
  elems_per_wavelength: 10
  min_elems_x: 100
  min_elems_y: 16
  degree: 2

sensors:
  n_sensors: 301                # High spatial resolution along plate top face (y = 4.0 mm)
  sensor_offset: 0.03           # [m] 30 mm
  sensor_pitch: 0.4e-3          # [m] 0.4 mm

postprocess:
  run_postprocess: true
  f_min_disp_MHz: 0.0
  f_max_disp_MHz: 1.0
  k_min_disp: 0.0
  k_max_disp: 3.0

output:
  output_dir: "results_bonedc_case1_cb"
  write_vtx: false
  target_snapshots: 200
