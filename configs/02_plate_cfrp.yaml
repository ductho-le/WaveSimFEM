# Symmetric cross-ply CFRP plate, T300/914 [0/90/0/90]_s
# Eight perfectly bonded elastic plies, each 0.125 mm thick, form a 1 mm plate.
# Faces are traction-free except for the mixed top load; lateral sponges
# truncate the propagation domain. Explicit RK4 advances the displacement field.
#
# Application
#   Guided-wave dispersion in an aerospace carbon-fibre/epoxy laminate.
# Model and numerical scope
#   Linear 2D plane strain: x1 is propagation, x2 is thickness, and x3 is the
#   invariant plate direction. Fibres lie along x1 in 0-degree plies and along
#   x3 in 90-degree plies. These orientations permit in-plane/out-of-plane
#   decoupling. The bottom-to-top lay-up is [0,90,0,90,90,0,90,0].
#   Representative published ply constants are E_L = 140 GPa, E_T = 10.05 GPa,
#   G_LT = 5.7 GPa, G_TT = 3.4 GPa, nu_LT = 0.313, and rho = 1560 kg/m^3.
#   Transverse isotropy gives nu_TT = E_T/(2*G_TT)-1. The C arrays below are
#   reconstructed by inverting the full 3D engineering compliance, rotating
#   each ply into the global axes, then selecting the plane-strain restriction
#   [sigma11,sigma22,sigma12] versus [epsilon11,epsilon22,2*epsilon12]. They are
#   not plane-stress laminate constants; the configuration has no rotation key.
#   The broadband 1 MHz Ricker pulse is analysed to 2 MHz. No material viscosity
#   is included, so spatial decay must not be interpreted as intrinsic loss.
#   Establish mesh, RK4 step, record-length, and sponge convergence; compare
#   guided branches with an independent anisotropic multilayer solution.
# Usage
#   sh tools/run_cpu4.sh -c configs/02_plate_cfrp.yaml
#   Add --dry-run to inspect resource estimates. Run from the repository root.
#   Single-process CUDA runs can select --device cuda when available.
# Conventions
#   Numeric inputs use SI units; C uses Pa. Layer and mesh lists run bottom-to-top.
#   API fields source_x and sensor_y refer to x1 and x2; source_fy is the
#   loading-direction component along x2.
#   null selects the documented automatic rule. See template.yaml and README.md.
#
# Reference
#   V. Giurgiutiu and M. F. Haider (2019), "Propagating, Evanescent, and Complex
#   Wavenumber Guided Waves in High-Performance Composites", Materials 12(2), 269.
#   Table 2 and Eq. (6): https://doi.org/10.3390/ma12020269

solver:
  type: "explicit"            # Classical four-stage RK4 with lumped mass
  CFL: 0.8                    # Fraction of the assembled damping-aware stability limit
  device: cpu                 # Reproducible float64 baseline; CUDA is optional
  precision: double
  dt: null                    # [s] Calculated from the assembled operators
  duration: 250.0e-6           # [s] Broadband view; longer Hann-windowed records favour slow cutoff tails

geometry:
  sensing_length: 0.30         # [m]
  absorb_length: 0.05          # [m]

structure:
  mode: "N_layers"
  layers:
    - name: "T300/914 ply 1, 0 deg (bottom)"
      thickness: 0.125e-3      # [m]
      material_model: "anisotropic"
      rho: 1560.0             # [kg/m^3]
      # Global engineering order [C11, C12, C16, C22, C26, C66], in Pa
      C: &C0 [143.876383802e9, 6.19230639359e9, 0.0, 13.2918632485e9, 0.0, 5.7e9]

    - name: "T300/914 ply 2, 90 deg"
      thickness: 0.125e-3
      material_model: "anisotropic"
      rho: 1560.0
      C: &C90 [13.2918632485e9, 6.49186324855e9, 0.0, 13.2918632485e9, 0.0, 3.4e9]

    - name: "T300/914 ply 3, 0 deg"
      thickness: 0.125e-3
      material_model: "anisotropic"
      rho: 1560.0
      C: *C0

    - name: "T300/914 ply 4, 90 deg"
      thickness: 0.125e-3
      material_model: "anisotropic"
      rho: 1560.0
      C: *C90

    - name: "T300/914 ply 5, 90 deg"
      thickness: 0.125e-3
      material_model: "anisotropic"
      rho: 1560.0
      C: *C90

    - name: "T300/914 ply 6, 0 deg"
      thickness: 0.125e-3
      material_model: "anisotropic"
      rho: 1560.0
      C: *C0

    - name: "T300/914 ply 7, 90 deg"
      thickness: 0.125e-3
      material_model: "anisotropic"
      rho: 1560.0
      C: *C90

    - name: "T300/914 ply 8, 0 deg (top)"
      thickness: 0.125e-3
      material_model: "anisotropic"
      rho: 1560.0
      C: *C0

absorbing_boundaries:
  alpha: null                 # Frequency-scaled lateral sponge damping [1/s]
  beta: null                  # Stiffness-proportional sponge damping [s]

excitation:
  source_type: "ricker"        # Broadband pulse for 2D-FFT dispersion extraction
  f_center: 1.0e6              # [Hz]
  traction_max: 1.0e6          # [Pa]
  excitation_width: 0.5e-3     # [m] Gaussian sigma = width/3; retain short-wavelength branches
  source_x: null              # [m] Automatic x1 position inside the sensing region
  source_fx: 1.0              # Tangential load along x1
  source_fy: 1.0              # Normal load along x2

mesh:
  nx: 3300                    # Full 400 mm domain; dx = 0.121 mm
  ny_per_region: [2, 2, 2, 2, 2, 2, 2, 2] # Two Q2 cells per ply, bottom-to-top
  degree: 2
  max_frequency: 2.0e6         # [Hz] Accuracy/sampling band, not a source filter
  min_frequency: 0.2e6         # [Hz] Arrival-sizing edge; does not filter the pulse
  min_wavelength: null        # Supply a bound from anisotropic laminate dispersion

sensors:
  n_sensors: 801
  sensor_offset: 0.05          # [m]
  sensor_pitch: 0.25e-3        # [m]; 200 mm aperture, spatial Nyquist = 12.57 rad/mm
  sensor_y: null              # Upper plate face, x2 = 1 mm
  sample_rate: "20 MHz"       # Requested storage rate; actual rate is recorded

# Display limits do not filter the excitation or recorded histories.
postprocess:
  structure_analysis: true    # Measured dispersion ridges and component-resolved spectra
  run_postprocess: true
  lamb_modes: false           # Isotropic free-plate reconstruction does not apply to CFRP
  # Isolate the same guided packet before interpreting velocity or spatial decay.
  wave_characterisation:
    enabled: false            # Use dispersion reports rather than mixed-packet fits
    component: y             # API component y is the displacement u2
    frequency_band: ["0.0 MHz", "2.0 MHz"]
    time_window: null        # Full record; specify [start, end] in seconds for one packet
    min_relative_amplitude: 0.01
  f_min: 0.0
  f_max: "2 MHz"
  k_min: 0.0
  k_max: "6 rad/mm"            # Include slower branches beyond the aluminium display range

output:
  output_dir: "results_02_plate_cfrp"
  write_vtx: false
  quick_plot: true
  compress_output: false
  history_storage: memory     # Switch to disk if histories dominate available RAM
  figure_formats: [png]
  usetex: false
