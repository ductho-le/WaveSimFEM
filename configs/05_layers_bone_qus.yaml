# ==============================================================================
# Example 05 - structure.mode: "N_layers"
# Multilayered solid-fluid plate: bone marrow / cortical bone / soft tissue
# (Biomedical quantitative ultrasound, QUS axial transmission)
# ==============================================================================
# Physics
#   Axial-transmission QUS probes cortical bone (e.g. radius or tibia) in vivo
#   with ultrasonic transducer arrays placed on the skin. The anatomical
#   waveguide is a stratified solid-fluid plate bounded by traction-free surfaces:
#     - Inner layer (bottom): bone marrow (viscous/acoustic fluid) filling the
#       medullary cavity
#     - Intermediate layer (middle): cortical bone (anisotropic, viscoelastic
#       solid shell)
#     - Outer layer (top): soft tissue (skin/muscle acoustic fluid layer)
#
#   Guided waves (first-arriving signal FAS and flexural-like A0/leaky Lamb modes)
#   propagate along the composite waveguide, guided by multiple internal reflections
#   and solid-fluid boundary interactions. Their dispersion and attenuation are
#   sensitive to cortical thickness, intracortical porosity, and soft-tissue
#   layer thickness, providing non-invasive assessment of osteoporosis and fracture risk.
#
# Model
#   - Layer 1 (Bottom, y in [0, 1] mm): Bone marrow, fluid,
#     rho = 930 kg/m^3, c = 1480 m/s (bulk modulus K = 2.037 GPa)
#   - Layer 2 (Middle, y in [1, 5] mm): Cortical bone, transversely isotropic,
#     Kelvin-Voigt viscoelastic solid, rho = 1948 kg/m^3;
#     bone axis along x (C11 = 31.7 GPa), radial along y (C22 = 20.2 GPa);
#     Cv = [157.0, 121.0, 0.0, 109.0, 0.0, 18.0] Pa*s
#   - Layer 3 (Top, y in [5, 6] mm): Soft tissue, fluid,
#     rho = 1000 kg/m^3, c = 1500 m/s (bulk modulus K = 2.25 GPa)
#
# Boundary conditions
#   Traction-free top (skin / air) and bottom (marrow / cavity) surfaces;
#   normal traction excitation applied on the skin (top surface of soft tissue,
#   y = 6.0 mm); sensors record along the skin surface (y = 6.0 mm);
#   lateral absorbing sponge layers truncate the waveguide ends along x.
#
# References
#   - D. T. Le et al. (2025), "Guided waves in anisotropic and viscoelastic
#     stratified plates: application to bone quantitative ultrasound",
#     Computers & Structures.
#   - E. Bossy, M. Talmant, P. Laugier (2004), "Three-dimensional simulations of
#     ultrasonic axial transmission velocity measurement on cortical bone models",
#     J. Acoust. Soc. Am. 115, 2314-2324.
#   - P. Moilanen (2008), "Ultrasonic guided waves in bone",
#     IEEE Trans. Ultrason. Ferroelectr. Freq. Control 55, 1277-1286.
# ==============================================================================

solver:
  type: "explicit"
  CFL: 0.5                      # Fraction (0, 1] of the rigorous RK4 stability limit
  time_factor: 1.2              # T = 1.2 * sensing_length / slowest speed + pulse length

geometry:
  sensing_length: 0.06          # [m] 60 mm along the bone axis
  absorb_length: 0.03           # [m] 30 mm lateral sponges

structure:
  mode: "N_layers"              # Stratified solid-fluid plate (layers bottom -> top)
  layers:
    - name: "Bone marrow"
      thickness: 1.0e-3         # [m] 1.0 mm marrow fluid layer
      material_model: "fluid"
      rho: 930.0                # [kg/m^3]
      c: 1480.0                 # [m/s]
      min_elems_y: 6

    - name: "Cortical bone"
      thickness: 4.0e-3         # [m] 4.0 mm cortical shell
      material_model: "viscoelastic"
      rho: 1948.0               # [kg/m^3]
      # Plane-strain Voigt order [C11, C12, C16, C22, C26, C66]
      C: [31.7e9, 13.4e9, 0.0, 20.2e9, 0.0, 6.38e9]   # [Pa]
      Cv: [157.0, 121.0, 0.0, 109.0, 0.0, 18.0]        # [Pa*s]
      min_elems_y: 16

    - name: "Soft tissue"
      thickness: 1.0e-3         # [m] 1.0 mm soft tissue fluid layer
      material_model: "fluid"
      rho: 1000.0               # [kg/m^3]
      c: 1500.0                 # [m/s]
      min_elems_y: 6

excitation:
  source_type: "ricker"
  f_center: 500.0e3             # [Hz] 500 kHz (typical axial-transmission band 0.2-1 MHz)
  traction_max: 1.0e6           # [Pa]
  excitation_width: 2.0e-3      # [m]
  source_x: null                # [m] null = absorb_length + lambda_ref (<= sensing_length / 8)
  source_fx: 0.0                # Normal compression from transducer on skin surface
  source_fy: 1.0

mesh:
  elems_per_wavelength: 8       # Per shortest wavelength in the stratified structure
  min_elems_x: 100
  min_elems_y: 4
  degree: 2
  max_frequency: 1.0e6          # [Hz]

sensors:
  n_sensors: 81                 # Transducer array on the skin surface (y = 6.0 mm)
  sensor_offset: 0.01           # [m] 10 mm source-to-first-receiver
  sensor_pitch: 0.5e-3          # [m] 0.5 mm pitch (40 mm total receiver aperture)
  sensor_y: null                # null = top surface of soft tissue (y = 6.0 mm)

postprocess:
  run_postprocess: true
  f_min: 0.0
  f_max: "1 MHz"
  k_min: 0.0
  k_max: "4 rad/mm"

output:
  output_dir: "results_05_layers_bone_qus"
  write_vtx: false
  target_snapshots: 200
