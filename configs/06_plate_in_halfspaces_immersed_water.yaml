# ==============================================================================
# Example 06 - structure.mode: "plate_in_halfspaces"
# Aluminium plate immersed in water (bilateral fluid loading / immersion NDE)
# ==============================================================================
# Physics
#   Guided wave propagation in an elastic plate immersed in an acoustic fluid
#   (bilateral fluid loading), representative of ultrasonic immersion testing
#   (UT), acoustic leak detection in submerged piping, and naval structures.
#     - Central plate (y in [0, 1.5] mm): Aluminium plate (isotropic solid)
#     - Bottom substrate (y in [-8, 0] mm): Water halfspace with absorbing sponge
#     - Top superstrate (y in [1.5, 9.5] mm): Water halfspace with absorbing sponge
#
# Boundary & Acoustic Coupling
#   - Conforming displacement-based fluid elements with shear regularisation
#     (mu_f = 1e-8 * K_f) enforce normal kinematic continuity and fluid pressure
#     across both solid-fluid interfaces.
#   - 4-way absorbing sponges truncate the computational domain: lateral sponges
#     absorb propagating guided waves along x, while top and bottom sponges absorb
#     bulk acoustic waves radiating into the fluid halfspaces.
#   - Excitation applied at the upper plate-fluid interface (y = H_plate = 1.5 mm)
#     generates leaky Lamb modes radiating into both halfspaces, as well as
#     Scholte interface waves localized at the solid-fluid interfaces.
#
# References
#   - M. J. S. Lowe (1995), "Matrix techniques for modeling ultrasonic waves in
#     multilayers", IEEE Trans. Ultrason. Ferroelectr. Freq. Control 42, 525-542.
#   - I. A. Viktorov (1967), "Rayleigh and Lamb Waves: Physical Theory and Applications",
#     Plenum Press, New York.
# ==============================================================================

solver:
  type: "explicit"
  CFL: 0.5                      # Fraction (0, 1] of the rigorous RK4 stability limit
  time_factor: 1.2              # T = 1.2 * sensing_length / slowest speed + pulse length

geometry:
  sensing_length: 0.06          # [m] 60 mm sensing region along upper plate-water interface
  absorb_length: 0.03           # [m] 30 mm lateral sponge width

structure:
  mode: "plate_in_halfspaces"
  layers:
    - name: "Aluminium plate"
      thickness: 1.5e-3         # [m] 1.5 mm plate thickness
      material_model: "isotropic"
      rho: 2700.0               # [kg/m^3]
      E: 70.0e9                 # [Pa] Young's modulus
      nu: 0.33                  # [-] Poisson's ratio
      min_elems_y: 6

  substrate:
    name: "Water (bottom halfspace)"
    thickness: 8.0e-3           # [m] 8 mm truncation depth
    absorb_depth: 5.0e-3        # [m] 5 mm bottom acoustic sponge
    material_model: "fluid"
    rho: 1000.0                 # [kg/m^3] Water density
    c: 1480.0                   # [m/s] Sound speed in water
    min_elems_y: 10

  superstrate:
    name: "Water (top halfspace)"
    thickness: 8.0e-3           # [m] 8 mm truncation height
    absorb_depth: 5.0e-3        # [m] 5 mm top acoustic sponge
    material_model: "fluid"
    rho: 1000.0                 # [kg/m^3] Water density
    c: 1480.0                   # [m/s] Sound speed in water
    min_elems_y: 10

excitation:
  source_type: "ricker"
  f_center: 500.0e3             # [Hz] 500 kHz center frequency
  traction_max: 1.0e6           # [Pa]
  excitation_width: 2.0e-3      # [m]
  source_x: null                # [m] null = absorb_length + lambda_ref
  source_fx: 0.0                # Normal load on upper plate-fluid interface
  source_fy: 1.0

mesh:
  elems_per_wavelength: 8       # Per shortest wavelength in water (1.48 mm at 1 MHz)
  min_elems_x: 100
  min_elems_y: 4
  degree: 2
  max_frequency: 1.0e6          # [Hz]

sensors:
  n_sensors: 81                 # Sensors on the upper plate-water interface (y = 1.5 mm)
  sensor_offset: 0.01           # [m] 10 mm source-to-first-receiver
  sensor_pitch: 0.5e-3          # [m] 0.5 mm pitch (40 mm aperture)

postprocess:
  run_postprocess: true
  f_min: 0.0
  f_max: "1 MHz"
  k_min: 0.0
  k_max: "4 rad/mm"

output:
  output_dir: "results_06_plate_in_halfspaces_immersed_water"
  write_vtx: false
  target_snapshots: 200
