# Aluminium plate immersed in water (bilateral fluid loading / immersion NDE)
# Loading and sensing are at the upper plate-water interface, y = 1.5 mm.
# Lateral sponges absorb guided waves; top and bottom sponges backed by plane-wave
# radiation boundaries absorb acoustic radiation into both water halfspaces.
# Water uses scalar-pressure inviscid acoustics coupled to plate displacement
# by normal traction and acceleration; tangential slip is allowed.
#
# Application
#   Fluid-loading effects on plate dispersion in ultrasonic immersion inspection.
# Model and numerical scope
#   Linear 2D plane-strain 1.5 mm plate between truncated water halfspaces, excited
#   by a 1 MHz Ricker interface traction (analysed to 2 MHz). The 200 mm, 801-receiver
#   array (0.25 mm pitch, spatial Nyquist 12.57 rad/mm) resolves leaky Lamb and
#   subsonic quasi-Scholte branches without spatial aliasing. Each 10 mm water region
#   provides 6 mm clear water plus a 4 mm quintic sponge backed by a radiation impedance.
# Usage
#   sh tools/run_cpu4.sh -c configs/06_plate_in_halfspaces_immersed_water.yaml
#   Add --dry-run to inspect resource estimates. Run from the repository root.
#   The launcher uses four MPI ranks with one library thread per rank.
# Conventions
#   Numeric inputs use SI units; null selects automatic sizing. Mesh region counts
#   run bottom-to-top. See template.yaml and README.md for parameter guidance.
#
# References
#   - M. J. S. Lowe (1995), "Matrix techniques for modeling ultrasonic waves in
#     multilayers", IEEE Trans. Ultrason. Ferroelectr. Freq. Control 42, 525-542.
#   - I. A. Viktorov (1967), "Rayleigh and Lamb Waves: Physical Theory and Applications",
#     Plenum Press, New York.

solver:
  type: "explicit"
  CFL: 0.8                     # Fraction of the assembled RK4 stability limit
  device: cpu
  precision: double
  dt: null                     # [s] Use the assembled RK4 stability bound
  duration: 160.0e-6           # Full guided-mode window across the 200 mm aperture
  time_factor: 1.2             # Travel-time multiplier for automatic duration

geometry:
  sensing_length: 0.22          # [m]
  absorb_length: 0.02           # [m]

structure:
  mode: "plate_in_halfspaces"
  layers:
    - name: "Aluminium plate"
      thickness: 1.5e-3         # [m]
      material_model: "isotropic"
      rho: 2700.0               # [kg/m^3]
      E: 70.0e9                 # [Pa]
      nu: 0.33

  substrate:
    name: "Water (bottom halfspace)"
    thickness: 10.0e-3          # [m] Truncation depth (6.0 mm clear water + 4.0 mm sponge)
    absorb_depth: 4.0e-3        # [m] Sponge inside the truncation depth
    material_model: "fluid"
    fluid_formulation: "acoustic"
    rho: 1000.0                 # [kg/m^3]
    c: 1480.0                   # [m/s]

  superstrate:
    name: "Water (top halfspace)"
    thickness: 10.0e-3          # [m] Truncation height (6.0 mm clear water + 4.0 mm sponge)
    absorb_depth: 4.0e-3        # [m]
    material_model: "fluid"
    fluid_formulation: "acoustic"
    rho: 1000.0                 # [kg/m^3]
    c: 1480.0                   # [m/s]

absorbing_boundaries:
  alpha: null                  # Frequency-scaled lateral and outer-water sponges
  beta: null

acoustic_boundaries:
  top: radiation               # Plane-wave impedance backing behind outer-water sponges
  bottom: radiation
  left: radiation
  right: radiation

excitation:
  source_kind: "traction"
  source_boundary: "interface"
  source_y: 1.5e-3             # [m] Upper plate-water interface
  source_region: "Aluminium plate"
  source_type: "ricker"
  f_center: 1.0e6              # [Hz]
  traction_max: 1.0e6          # [Pa]
  excitation_width: 0.5e-3     # [m]
  source_x: null               # [m] Automatic source position inside the sensing region
  source_fx: 1.0
  source_fy: 1.0

mesh:
  nx: 1200                     # Full 260 mm domain; dx = 0.217 mm
  ny_per_region: [40, 4, 40]   # Bottom water (dy=0.25 mm) / Al (dy=0.375 mm) / top water
  degree: 2
  max_frequency: 2.0e6         # [Hz]
  min_frequency: 0.1e6         # [Hz] Arrival-sizing lower edge, not a filter
  min_wavelength: null         # Replace with a validated guided/interface-mode bound

sensors:
  observable: "displacement"
  region: "Aluminium plate"    # Select the solid side of the interface
  n_sensors: 801
  sensor_offset: 0.01          # [m]
  sensor_pitch: 0.25e-3        # [m]; 200 mm aperture (spatial Nyquist 12.57 rad/mm)
  sensor_y: null               # Upper plate-water interface, y = 1.5 mm
  sample_rate: "20 MHz"        # 10 samples per 2 MHz band-edge period

# Display limits do not filter the excitation or recorded histories.
postprocess:
  structure_analysis: true     # Structure-specific dispersion, wave references and transport panels
  run_postprocess: true
  # Receiver reports: apparent attenuation includes radiation leakage into water.
  wave_characterisation:
    enabled: true
    component: y
    frequency_band: ["0.5 MHz", "1.5 MHz"]
    time_window: null          # Full record; specify [start, end] in seconds to isolate a mode
    min_relative_amplitude: 0.01 # Exclude peaks below 1% of the array maximum
  f_min: 0.0
  f_max: "2 MHz"
  k_min: 0.0
  k_max: "8.5 rad/mm"

# Receiver histories and figures; full-field output is optional.
output:
  output_dir: "results_06_plate_in_halfspaces_immersed_water"
  write_vtx: false
  quick_plot: true
  compress_output: false
  history_storage: memory
  figure_formats: [png]
  usetex: false                # true enables external LaTeX; default needs no TeX install
