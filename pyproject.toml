[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wavesimfem"
version = "0.4.0"
description = "A GPU-accelerated multi-scale finite element framework for acoustic and elastic wave simulation in heterogeneous layered media"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ductho Le" }]
keywords = [
    "wavesim",
    "guided-waves",
    "lamb-waves",
    "rayleigh-waves",
    "ultrasonics",
    "finite-element-method",
    "dolfinx",
    "dispersion-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# DOLFINx, PETSc, petsc4py and mpi4py are required at runtime but are not
# reliably pip-installable; install them from conda-forge (see environment.yml).
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "PyYAML>=6"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2", "pre-commit>=3.7"]

[project.urls]
Homepage = "https://github.com/ductho-le/WaveSimFEM"
Repository = "https://github.com/ductho-le/WaveSimFEM"
Issues = "https://github.com/ductho-le/WaveSimFEM/issues"
Changelog = "https://github.com/ductho-le/WaveSimFEM/blob/main/CHANGELOG.md"

[project.scripts]
wavesim = "wavesimfem._launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wavesimfem = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: end-to-end physics verification runs (deselect with -m 'not slow')",
    "gpu: requires a CUDA device and CuPy",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["wavesimfem"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "I", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are handled by the formatter; strings/URLs may exceed
    "RUF001",  # ambiguous unicode in strings (μ, λ, ×, ─ are intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["wavesimfem"]
