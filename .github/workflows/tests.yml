name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run full DOLFINx, MPI, LaTeX and source-distribution tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.16.9" # keep in sync with .pre-commit-config.yaml
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools

  test:
    # Routine pushes/PRs use the lightweight jobs below; full verification is opt-in.
    if: github.event_name == 'workflow_dispatch' && inputs.full_tests
    name: Tests (Python ${{ matrix.python }}, DOLFINx ${{ matrix.dolfinx }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        dolfinx: ["0.10.0"]
    defaults:
      run:
        shell: micromamba-shell {0}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      FI_PROVIDER: "tcp"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mamba-org/setup-micromamba@0dea6379afdaffa5d528b3d1dabc45da37f443fc # v2.0.4
        timeout-minutes: 10
        with:
          environment-file: environment.yml
          create-args: >-
            python=${{ matrix.python }}
            fenics-dolfinx=${{ matrix.dolfinx }}
          cache-environment: true
      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Install LaTeX figure dependencies
        shell: bash
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra cm-super dvipng ghostscript
      - name: Serial test suite (with coverage)
        run: python -m pytest --cov --cov-report=term --cov-report=xml
      - name: Distributed tests (2 MPI ranks)
        run: mpiexec -n 2 python -m pytest -q -p no:cacheprovider tests/test_numerics.py tests/test_acoustic_time.py -k "exact_point or gather or distributed or rank_local"
      - name: Test extracted source distribution
        run: |
          python -m build --sdist --outdir "$RUNNER_TEMP/release"
          mkdir "$RUNNER_TEMP/release-test"
          tar -xzf "$RUNNER_TEMP"/release/*.tar.gz -C "$RUNNER_TEMP/release-test" --strip-components=1
          python -m pip install --no-deps --no-build-isolation --force-reinstall "$RUNNER_TEMP/release-test"
          cd "$RUNNER_TEMP/release-test"
          python -m pytest -q -m "not slow"
      - name: CLI smoke test
        run: |
          wavesim --version
          for example in configs/*.yaml; do wavesim -c "$example" --dry-run -q; done
      - name: Example smoke runs (2 MPI ranks, shortened)
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          destination = Path(os.environ["RUNNER_TEMP"])
          for filename, nx, rows in (
              ("03_halfspace_steel_rayleigh.yaml", 188, [25]),
              ("02_plate_cfrp.yaml", 873, [1] * 8),
          ):
              cfg = yaml.safe_load((Path("configs") / filename).read_text())
              cfg["mesh"].update(nx=nx, ny_per_region=rows, min_frequency=None)
              (destination / filename).write_text(yaml.safe_dump(cfg))
          PY
          mpiexec -n 2 wavesim -c "$RUNNER_TEMP/03_halfspace_steel_rayleigh.yaml" -q \
            --duration 4e-6 --max-frequency 5e5 --no-postprocess --output "$RUNNER_TEMP/ex03"
          mpiexec -n 2 wavesim -c "$RUNNER_TEMP/02_plate_cfrp.yaml" -q \
            --duration 8e-6 --max-frequency 5e5 --no-postprocess --output "$RUNNER_TEMP/ex02"
          test -s "$RUNNER_TEMP/ex03/sensor_data.npz" && test -s "$RUNNER_TEMP/ex02/sensor_data.npz"

  array-backends:
    name: Pure-Python & array backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      FI_PROVIDER: "tcp"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
        timeout-minutes: 3
      - name: Pure-Python and array backend tests
        run: >-
          python -m pytest -q -m "not gpu and not slow"
          tests/test_analysis.py
          tests/test_backend_validation.py
          tests/test_benchmark.py
          tests/test_characterisation.py
          tests/test_empty_streaming.py
          tests/test_figure_style.py
          tests/test_lamb.py
          tests/test_parallel.py
          tests/test_postprocessing_quality.py
          tests/test_reference_template.py
          tests/test_structure_analysis.py
          tests/test_units_sources.py
          tests/test_wave_reports.py
          tests/test_wave_spectra.py
          tests/test_yaml_merges.py

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
        timeout-minutes: 3
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel and verify metadata
        run: |
          python -m pip install dist/*.whl
          python -c "import wavesimfem as g; print(g.__version__); assert g.__version__ != '0.0.0+unknown'"
