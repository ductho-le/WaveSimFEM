name: Feature Request
description: Suggest a new physics capability, solver option, diagnostic, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Motivation & Use Case
      description: Describe the physical problem, workflow bottleneck, or limitation you are trying to solve.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the desired YAML schema, CLI flags, Python API, or numerical behavior.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References / Alternatives (Optional)
      description: Relevant literature, analytical benchmarks, or alternative approaches considered.
